             <p>Feito por Gustavo Rocha.</p>
            </div >     
        </div>
            <ul class="menu-principal">
                <li><a href="../index.html">Home</a></li>

                    <span class="sublista-titulo">O Mundo de One Piece</span>

            </ul>
    </header>
    <main>
        <button id="botao-tema">
            <span id="icone-tema">🌙</span></button>
      <section id="recrutamento">
        <h2>Cadastrar Novo Pirata</h2>
        <form id="form-pirata">
            <!--criando o formulario-->
            <div style="margin-bottom: 10px;width: 100%;text-align: center;">
                <input type="text" id="nomePirata" placeholder="Nome do pirata..." required style="padding:  9px;border-radius: 15px;">
                <!--criando um input tipo texto para o nome e ja deixando pra required,afinal e obrigatorio o nome-->
            </div>
            <div style="margin-bottom: 10px;width: 100%;text-align: center;">
                <select id="cargo" style="border-radius: 12px;">
                    <!--adicionamos o select para selecionar o cargo que o usuario deseja-->
                    <option value="Capitão">Capitão</option>
                        <option value="Espadachim">Espadachim</option> 
                        <option value="Navegador(a)">Navegador(a)</option>
                        <option value="Cozinheiro(a)">Cozinheiro(a)</option>
                        <option value="Atirador(a)">Atirador(a)</option>
                        <option value="Arqueólogo(a)">Arqueólogo(a)</option>
                </select>
            </div>
            <!--apos isso criamos um outro input texto,para a fruta desejada,é opcional adicionar-->
            <div style="margin-bottom: 10px; width: 100%; text-align: center;">
                <input type="text" id="akumaPirata" placeholder="Akuma no Mi (opcional)..." style="padding: 8px;border-radius: 15px;">
            </div>
            <!--por fim,temos um botao tipo submit para enviar os dados que foram inseridos-->
            <button type="submit" style="padding: 10px 20px;background-color: #f1c40f;border: none;font-weight: bold;cursor: pointer;border-radius: 15px; font-family: Source Code Pro">Recrutar para o Bando</button>
        </form>
        <!--aqui vamos mostrar na tela a tripulação atual e ,depois dos dados inseridos,com o novo membro-->
        <h3 style="margin-top: 30px;">Tripulação Atual:</h3>
        <ul id="listaTripulacao"></ul> <!--deixamos essa <ul> vazia porque vamos injetar ela dinamicamente com js com o innerHtml-->
      </section>
    </main>
